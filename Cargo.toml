[package]
name = "grimoire_css"
version = "1.9.0"
edition = "2024"
rust-version = "1.93.0"
authors = ["Dmitrii Shatokhin <dmtrshatokhin@gmail.com>"]
description = "A magical CSS engine for all environments"
autobins = false
license = "MIT"
keywords = ["css", "css-compiler", "styling", "web", "system"]
categories = ["web-programming", "development-tools"]
homepage = "https://github.com/persevie/grimoire-css"
documentation = "https://docs.rs/grimoire-css"
repository = "https://github.com/persevie/grimoire-css"
include = [
    "src/**",
    "!src/**/.DS_Store",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "assets/grimoire-css-logo.png",
]

[lib]
name = "grimoire_css_lib"
crate-type = ["lib"]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = 2

[dependencies]
console = "0.16.2"
cssparser = "0.33.0"
dhat = { version = "0.3.3", optional = true }
glob = "0.3.3"
grimoire_css_color_toolkit = "1.0.0"
indicatif = "0.18.3"
indexmap = "2.12.1"
jsonschema = { version = "0.33.0", default-features = false, optional = true }
lazy_static = "1.5.0"
lightningcss = { version = "1.0.0-alpha.68", features = ["browserslist"] }
miette = { version = "7.6.0", features = ["fancy"] }
once_cell = "1.21"
regex = "1.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = { version = "3.24.0", optional = true }
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time", "sync"], optional = true }
tower-lsp = { version = "0.20.0", optional = true }
ureq = { version = "2.12.1", default-features = false, features = ["tls"], optional = true }

[features]
default = ["analyzer"]
heap-profile = ["dhat"]
analyzer = []
lsp = ["analyzer", "dep:tokio", "dep:tower-lsp", "dep:ureq"]
mcp = ["analyzer", "dep:jsonschema", "dep:tempfile"]

[[bin]]
name = "grimoire_css"
path = "src/main.rs"

[[bin]]
name = "grimoire_css_lsp"
path = "src/bin/grimoire_css_lsp.rs"
required-features = ["lsp"]

[[bin]]
name = "grim"
path = "src/bin/grim.rs"

[[bin]]
name = "grimoire_css_mcp"
path = "src/bin/grimoire_css_mcp.rs"
required-features = ["mcp"]

[dev-dependencies]
tempfile = "3.24.0"
