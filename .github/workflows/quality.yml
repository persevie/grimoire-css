name: Quality

on:
  workflow_call:
  pull_request:
    branches:
      - 'main'
      - 'rc/**'

jobs:
  lint_and_test:
    name: Rust / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            os: ubuntu-latest
            flags: ''
          - name: minimal
            os: ubuntu-latest
            flags: --no-default-features
          - name: mcp
            os: ubuntu-latest
            flags: --features mcp
          - name: all-linux
            os: ubuntu-latest
            flags: --all-features
          - name: all-macos
            os: macos-latest
            flags: --all-features
          - name: all-windows
            os: windows-latest
            flags: --all-features

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.0
          components: clippy,rustfmt

      - name: Print Rust toolchain versions
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.name }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-cargo-build-

      - name: Check formatting with rustfmt
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets ${{ matrix.flags }} -- -D warnings

      - name: Run tests
        run: cargo test --locked ${{ matrix.flags }}

      - name: Test documentation generator
        if: matrix.name == 'default'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  quality_result:
    name: PR / Lint and test
    needs: lint_and_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Rust checks to pass
        env:
          RESULT: ${{ needs.lint_and_test.result }}
        run: test "$RESULT" = success
